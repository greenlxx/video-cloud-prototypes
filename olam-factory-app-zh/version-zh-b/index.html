<!--
实现说明（2026-10-27）：单文件中文原型，共享页面，领导／厂长仅入口不同。
FACILITY_META 是 12 处设施目录，稳定 id 关联 WORLD 地理索引、FACTORIES 兼容索引、产品、覆盖与责任人。
新增 getFacility/selectFacility/getManagementEvents/getFacilityStatus/getCoverageSummary、经营摘要与关注页函数。
状态优先级：停产／重大异常（含高级未关闭告警）> 降速／利用率低于80% > 覆盖不足 > 正常。
新加坡为非生产设施，不参与利用率；规模按月设计产能加权。处置关闭不等于设备恢复。
关注页、全球卡片、告警详情共用 getManagementEvents；告警处置状态直接读取 ALERTS。
worldTrend(facilityId) 按厂取七日实际数据，仅拉各斯／卡诺完整，其他设施不借用曲线或维修记录。
所有数据均为模拟数据；快照固定于2026-10-26，刷新仅重读同一模拟快照，不更新时标。姓名为模拟责任人，无电话号码。
新增角色演示开关与 /attention；原设备、告警、现场、产量功能保留。无网络请求、外部依赖或持久化。
-->

function updateWorldMap(){
 const map=document.querySelector('.world-map');if(!map)return;
 const [vx,vy,vw,vh]=worldUI.box,width=map.clientWidth,height=map.clientHeight;
 const scale=Math.min(width/vw,height/vh),ox=(width-vw*scale)/2,oy=(height-vh*scale)/2;
 const points=WORLD.map(w=>({x:ox+((w[7]+180)/360*LAND_W-vx)*scale,y:oy+((90-w[8])/180*LAND_H-vy)*scale}));
 map.querySelector('.world-land').setAttribute('viewBox',worldUI.box.join(' '));
 map.querySelector('.world-markers').innerHTML=WORLD.map((w,i)=>{const p=points[i],s=worldStatus(w);return `<button class="world-dot" data-world="${i}" aria-label="${w[0]}，${s.name}" aria-pressed="${i===state.worldSel}" style="left:${p.x}px;top:${p.y}px;--point:${s.color};${p.x<0||p.x>width||p.y<0||p.y>height?'display:none':''}"></button>`}).join('');
 // 关注最高优先级工厂与选中工厂具名显示。
 const lowest=attentionEvents()[0]?getFacility(attentionEvents()[0].facilityId).worldIndex:state.worldSel;
 const selected=[...new Set([state.worldSel,lowest])].filter(i=>i>=0),placed=[];
 const labels=[],links=[];
 selected.forEach(i=>{
  const p=points[i],w=WORLD[i],s=worldStatus(w),lw=146,lh=48;
  // 优先贴近工厂；边缘钳制并避让另一气泡与右上角控件。缩放后仍保留两个关注标签。
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const candidates=[[p.x+12,p.y-lh-10],[p.x-lw-12,p.y-lh-10],[p.x+12,p.y+12],[p.x-lw-12,p.y+12]];
  for(let y=48;y<=height-30-lh-8;y+=lh+8)for(const x of [8,width-lw-8])candidates.push([x,y]);
  const boxes=candidates.map(([x,y])=>({x:clamp(x,8,width-lw-8),y:clamp(y,48,height-30-lh-8)}));
  const box=boxes.find(b=>!(b.x+lw>width-52&&b.y<122)&&placed.every(a=>b.x+lw+6<=a.x||b.x>=a.x+lw+6||b.y+lh+6<=a.y||b.y>=a.y+lh+6))||boxes[boxes.length-1];
  placed.push(box);
  const anchorX=clamp(p.x,box.x,box.x+lw),anchorY=clamp(p.y,box.y,box.y+lh);
  links.push(`<path d="M${clamp(p.x,3,width-3)} ${clamp(p.y,35,height-33)}L${anchorX} ${anchorY}" stroke="${s.color}" stroke-opacity=".65" fill="none"/>`);
  labels.push(`<button class="world-label" data-world="${i}" style="left:${box.x}px;top:${box.y}px;--point:${s.color}" aria-label="查看${w[0]}详情"><strong>${w[0]}</strong><small>${s.name} · 快照 ${worldTime(w).time}</small></button>`);
 });
 map.querySelector('.world-labels').innerHTML=labels.join('');map.querySelector('.world-links').innerHTML=links.join('');
 map.querySelector('[data-world-zoom=in]').disabled=worldUI.zoom>=2.5;
 map.querySelector('[data-world-zoom=out]').disabled=worldUI.zoom<=1;
 document.querySelectorAll('[data-world-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.worldPeriod===worldUI.period));
}

}

function site(){return peopleSection()+vehiclesSection()}
function output(){
 if(getFacility().coverage!=='full')return `<div class="note">${getCoverageSummary(getFacility().id)}</div>`;
 const f=factory(),op=OPERATIONS[f.id],today=state.outputRange==='今日',actual=f.products.reduce((s,p)=>s+p.actual,0),plan=f.products.every(p=>p.plan!=null)?f.products.reduce((s,p)=>s+p.plan,0):null;
 const weekSum=(isLagos()?WEEK_OUTPUT.map(x=>x.flour+x.pasta):KANO_WEEK).reduce((a,b)=>a+b,0);
 const segs=`<div class="segs">${['今日','近七日'].map(v=>`<button class="seg${state.outputRange===v?' on':''}" data-set="outputRange" data-value="${v}">${v}</button>`).join('')}</div>`;
 if(!today){
  return `${segs}<div class="hero"><div class="top"><div><div class="lbl">近七日全厂累计</div><div class="big">${n(weekSum)}<i>吨</i></div><div class="sub"><div>周期<b>10月20—26日</b></div><div>七日计划<b>未接入</b></div></div></div></div></div><div class="spark"><div class="row"><span>近七日产出趋势</span><b>${n(weekSum)} 吨</b></div>${worldTrend(f.id)}</div>`;
 }

}

v></section><section class="card"><h2>关于</h2>${kv('应用','奥兰工厂运行')}${kv('版本','0.1')}${kv('数据更新时间',syncText())}</section>${futureCapabilities()}`}

function pageBody(r){const html=routes[r]();if(r==='/device/1')return oldConnection()+foldTechnical('展开设备参数、趋势、关联告警与维修记录',html);if(r==='/devices')return html;if(r==='/alerts')return html.replace(/<section class="filters">([\s\S]*?)<\/section>/,'<details class="card technical"><summary>按状态、级别与车间筛选</summary><div class="technical-body">$1</div></details>');if(r==='/site')return html;if(r==='/me')return html;return html}

const routes={'/world':worldView,'/attention':attentionPage,'/home':home,'/devices':()=>{state.factoryTab='devices';return home()},'/device/1':deviceDetail,'/alerts':alertsPage,'/alert/1':alertDetail,'/site':()=>{state.factoryTab='site';return home()},'/output':output,'/me':me};
let lastRoute='',navigationStack=[],restoringFrame=null;
const route=()=>location.hash.slice(1)||'/world';
function sourceLabel(){const names={'/world':'全球','/attention':'关注','/home':'工厂概况','/devices':'设备','/device/1':'设备详情','/alerts':'告警','/alert/1':'事件详情','/site':'现场','/output':'产量','/me':'我的'};return names[navigationStack[navigationStack.length-1]?.path]||'入口'}
function captureFrame(){return {path:route(),state:JSON.parse(JSON.stringify(state)),scroll:document.querySelector('#content').scrollTop,expanded:[...document.querySelectorAll('#content details')].map((el,i)=>el.open?i:-1).filter(i=>i>=0),period:worldUI.period}}
function go(path){if(path===route()){render(true);return}navigationStack.push(captureFrame());if(path==='/alerts'&&route()==='/home')state.alertStatus='未处理';state.modal=null;state.modalTrail=[];location.hash=path}
function navigateBack(){const frame=navigationStack.pop();if(!frame){go(state.viewRole==='leader'?'/world':'/home');return}restoringFrame=frame;Object.assign(state,frame.state);worldUI.period=frame.period;if(route()===frame.path){render();restoringFrame=null}else location.hash=frame.path}
function openDevice(id){const frame=captureFrame();state.device=Number(id);state.parameter='温度';state.trendRange='近24小时';if(route()==='/device/1'){render(true);return}navigationStack.push(frame);state.modal=null;state.modalTrail=[];location.hash='/device/1'}
function openAlert(id){const frame=captureFrame();state.alert=Number(id);if(route()==='/alert/1'){render(true);return}navigationStack.push(frame);state.modal=null;state.modalTrail=[];location.hash='/alert/1'}
function render(keepScroll=false){let r=route();if(!routes[r]){location.hash='/home';return}const scroll=document.querySelector('#content').scrollTop;const expanded=[...document.querySelectorAll('#content details')].map((el,i)=>el.open?i:-1).filter(i=>i>=0);const detail=['/device/1','/alert/1','/output','/home','/me','/devices','/alerts','/site'].includes(r);const title={'/home':'工厂概况','/attention':'关注','/devices':'设备','/device/1':'设备详情','/alerts':'告警','/alert/1':'事件详情','/site':'现场','/output':'产量','/me':'我的','/world':'全球'}[r];document.querySelector('#header').innerHTML=r==='/home'?`<button class="iconbtn" aria-label="返回" data-back>${icon('back')}</button><div class="headcopy"><button class="factory-title" data-open-factories><span>${factory().name}</span>${icon('down',16)}</button><small>${state.loading?'读取同一模拟快照…':syncText()}${navigationStack.length?' · 来自 '+sourceLabel():''}</small></div><button class="iconbtn" aria-label="刷新数据" data-refresh>${icon('refresh')}</button><button class="iconbtn" aria-label="我的账号" data-go="/me">${icon('me')}</button>`:`${detail?`<button class="iconbtn" aria-label="返回" data-back>${icon('back')}</button>`:''}<div class="headcopy"><h1>${title}</h1><small>${r==='/world'?'12 处设施 · 全球运行概览':r==='/attention'?'4 件事 · 按影响排序':factory().name}${navigationStack.length?' · 来自 '+({'/world':'全球','/attention':'关注','/home':'工厂概况','/devices':'设备','/device/1':'设备详情','/alerts':'告警','/alert/1':'事件详情','/site':'现场','/output':'产量','/me':'我的'}[navigationStack[navigationStack.length-1].path]||'上一屏'):''}</small></div><button class="iconbtn" aria-label="我的账号" data-go="/me">${icon('me')}</button>${!detail?`<button class="iconbtn" aria-label="${r==='/world'?'刷新数据':'刷新数据'}" data-refresh>${icon('refresh')}</button>`:''}`;
 document.querySelector('#content').innerHTML=`<div class="page">${state.syncFailed?`<button class="notice error" data-refresh>${icon('warning',18)}${r==='/world'?`同步失败，显示上次数据。${syncText()}，轻点重试。`:`同步失败，保留上次数据。${syncText()}. 轻点重试。`}</button>`:''}${pageConclusion(r)}${pageBody(r)}${demoNext(r)}</div>`;
 const a=selectedAlert();document.querySelector('#action').innerHTML=r==='/alert/1'&&state.viewRole==='director'&&a&&a.status!=='已关闭'?`<div class="actionbar"><button class="primary" ${a.claimedByOther?'disabled':''} data-alert-action>${a.claimedByOther?`已接单：${escapeHTML(a.handler)}`:a.status==='未处理'?'接单':'填写结果并关闭'}</button></div>`:'';
 const active=r==='/device/1'?'/home':r==='/alert/1'?'/attention':r==='/output'?'/home':r==='/devices'?'/home':r==='/site'?'/home':r==='/alerts'?'/attention':r;const nav=state.viewRole==='leader'?[['全球','world'],['关注','attention']]:[['本厂','home'],['关注','attention']];document.querySelector('#tabs').style.gridTemplateColumns=`repeat(${nav.length},1fr)`;document.querySelector('#tabs').innerHTML=nav.map(([label,ico])=>`<a href="#/${ico}" class="tab ${active==='/'+ico?'active':''}">${icon(ico==='attention'?'alerts':ico,22)}${label}</a>`).join('');
 if(keepScroll&&lastRoute===r)document.querySelectorAll('#content details').forEach((el,i)=>el.open=expanded.includes(i));if(!keepScroll||lastRoute!==r)document.querySelector('#content').scrollTop=0;else document.querySelector('#content').scrollTop=scroll;if(restoringFrame){document.querySelectorAll('#content details').forEach((el,i)=>el.open=(restoringFrame.expanded||[]).includes(i));document.querySelector('#content').scrollTop=restoringFrame.scroll;}lastRoute=r;document.title=`${title} · 奥兰`;if(r==='/world')updateWorldMap();renderModal();}
function closeAnyModal(){state.modal=state.modalTrail.pop()||null;renderModal()}
function renderModal(){if(state.modal==='compare'){document.querySelector('#modal').innerHTML=`<div class="overlay" data-overlay><section class="sheet" role="dialog" aria-modal="true" aria-label="四厂对比"><div class="handle"></div><div class="sectionhead"><h2>别的厂呢 · 四厂对比</h2><button class="iconbtn" data-close-modal aria-label="关闭四厂对比">${icon('close')}</button></div>${comparison()}</section></div>`;document.querySelector('[data-close-modal]').focus({preventScroll:true});return}if(state.modal==='world-detail'||state.modal==='world-list'){renderWorldModal();return}const modal=document.querySelector('#modal');if(!state.modal){modal.innerHTML='';return}modal.innerHTML=`<div class="overlay" data-overlay><section class="sheet" role="dialog" aria-modal="true" aria-label="${state.modal==='factories'?'选择工厂':'关闭告警'}"><div class="handle"></div><div class="sectionhead"><h2>${state.modal==='factories'?'选择工厂':'填写结果并关闭'}</h2><button class="iconbtn" data-close-modal aria-label="关闭">${icon('close',18)}</button></div>${state.modal==='factories'?`<p class="small" style="margin-bottom:16px">可访问工厂</p>${FACILITY_META.map((meta,i)=>{const f={name:WORLD[i][0]};return `<button class="factory-option" data-factory="${i}"><span><strong>${f.name}</strong><small>${getFacilityStatus(FACILITY_META[i].id).name} · ${FACILITY_META[i].coverage==='full'?'完整经营数据':'设施概况'}</small></span>${i===state.factory?`<span class="blue">${icon('check',20)}</span>`:icon('chevron',18)}</button>`}).join('')}`:`<form id="result-form"><p class="small">仅本次演示操作，不回写业务系统。固定时标 10月26日16:20；刷新页面恢复样例。记录采取的措施和处理结果。</p><div class="chips" style="margin-top:16px">${['保养','维修','更换','其他'].map(v=>`<button type="button" class="chip ${state.reason===v?'active':''}" data-reason="${v}">${v}</button>`).join('')}</div><label for="result" class="small" style="display:block;margin-top:16px">处理结果 · 必填</label><textarea id="result" name="result" minlength="10" required>${escapeHTML(state.result)}</textarea><p class="small">去除空格后至少10字；关闭后不可编辑。</p><div id="result-error" class="error-text" role="alert"></div><button class="primary" type="submit" style="margin-top:16px">提交并关闭</button></form>`}</section></div>`;}
function selectFactory(index){selectFacility(FACILITY_META[Number(index)].id);state.modal=null;state.device=1;state.alert=1;state.deviceStatus='全部';state.workshop='全部';state.alertStatus='全部';state.level='全部';state.alertWorkshop='全部';state.peopleRange='今日';state.vehicleRange='今日';state.outputRange='今日';state.product='全部';state.passage=null;state.anomaly=false;state.loading=true;render();setTimeout(()=>{state.loading=false;render(true)},350)}
function toast(text){document.querySelector('#feedback').innerHTML=`<div class="toast">${escapeHTML(text)}</div>`;setTimeout(()=>document.querySelector('#feedback').innerHTML='',3200)}
function refresh(){if(!navigator.onLine){state.syncFailed=true;render(true);return}state.loading=true;render(true);setTimeout(()=>{state.loading=false;state.syncFailed=false;state.lastSync=0;render(true)},400)}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(e.target.matches('[data-overlay]')){closeAnyModal();return}if(!el)return;
if(el.matches('.tab')){e.preventDefault();go(el.getAttribute('href').slice(1));return}if(el.hasAttribute('data-compare')){state.modalTrail=[];state.modal='compare';renderModal();return}if(el.hasAttribute('data-demo-old')){navigationStack.push(captureFrame());selectFacility('lagos');state.device=1;state.modal=null;state.modalTrail=[];location.hash='/device/1';return}if(el.dataset.role){navigationStack=[];state.viewRole=el.dataset.role;state.modal=null;go(state.viewRole==='leader'?'/world':'/home');return}if(el.dataset.factab){state.factoryTab=el.dataset.factab;render(true);return}if(el.dataset.go){go(el.dataset.go);return}if(el.hasAttribute('data-open-factories')){state.modal='factories';renderModal();return}if(el.hasAttribute('data-close-modal')){closeAnyModal();return}if(el.dataset.factory!=null){const frame=captureFrame();frame.state.modal=null;selectFactory(el.dataset.factory);if(route()!=='/home'){navigationStack.push(frame);location.hash='/home'}return}if(el.dataset.set){state[el.dataset.set]=el.dataset.value;if(el.dataset.set==='vehicleRange')state.passage=null;render(true);return}if(el.dataset.group){state.groups[el.dataset.group]=!state.groups[el.dataset.group];render(true);return}if(el.dataset.device){openDevice(el.dataset.device);return}if(el.dataset.alert){openAlert(el.dataset.alert);return}if(el.hasAttribute('data-back')){navigateBack();return}if(el.hasAttribute('data-refresh')){refresh();return}if(el.dataset.passage!=null){state.passage=state.passage===Number(el.dataset.passage)?null:Number(el.dataset.passage);render(true);return}if(el.hasAttribute('data-anomaly')){state.anomaly=!state.anomaly;render(true);return}if(el.dataset.downtime){state.downtime=state.downtime===el.dataset.downtime?null:el.dataset.downtime;render(true);return}if(el.dataset.subscription){state.subscriptions[el.dataset.subscription]=!state.subscriptions[el.dataset.subscription];render(true);return}if(el.dataset.reason){state.reason=el.dataset.reason;renderModal();document.querySelector('#result').focus();return}if(el.hasAttribute('data-more')){state.pageSize+=20;render(true);return}if(el.dataset.reset){if(el.dataset.reset==='devices'){state.deviceStatus='全部';state.workshop='全部'}else{state.alertStatus='全部';state.level='全部';state.alertWorkshop='全部'}render(true);return}if(el.hasAttribute('data-alert-action')){const a=selectedAlert();if(state.viewRole!=='director'||!a||a.status==='已关闭')return;if(a.status==='未处理'){if(!navigator.onLine){toast('接单失败，请重试。');return}a.status='处理中';a.handler='当前账号';a.acceptedAt=sessionTime();a.action='已接单处理';render(true)}else{state.modal='result';state.result='';state.reason='';renderModal();document.querySelector('#result').focus()}return}});
document.addEventListener('change',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;if(e.target.tagName==='SELECT')render(true)}});
document.addEventListener('input',e=>{if(e.target.id==='result')state.result=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='result-form')return;e.preventDefault();const a=selectedAlert(),result=state.result.trim(),compact=result.replace(/\s/g,''),err=document.querySelector('#result-error');if(compact.length<10){err.textContent='请填写不少于 10 个字的处理结果';return}if(state.viewRole!=='director'||!a)return;if(!navigator.onLine){err.textContent='提交失败，请重试，已保留处理结果。';return}if(a.claimedByOther){err.textContent=`该告警已被以下人员接单：${a.handler}.`;return}a.status='已关闭';a.result=(state.reason?state.reason+': ':'')+result;a.closedAt=sessionTime();a.duration=minutesSince(a.time);a.handler='当前账号';state.modal=null;render(true);toast('告警已关闭，处理结果已记录')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){closeAnyModal()}if(e.key==='Tab'&&state.modal){const nodes=[...document.querySelectorAll('#modal button:not(:disabled),#modal textarea')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{if(!restoringFrame)state.modal=null;render();restoringFrame=null});window.addEventListener('offline',()=>{state.syncFailed=true;render(true)});if(!location.hash)location.hash=(state.viewRole==='director'?'/home':'/world');render();

// 捕获阶段只接管全球页事件，避免通用点击处理触发整页渲染。
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-world],[data-world-list],[data-world-close],[data-world-period],[data-world-zoom],[data-enter],.world-overlay[data-overlay]');
 if(!el||el.classList.contains('world-overlay')&&e.target!==el)return;

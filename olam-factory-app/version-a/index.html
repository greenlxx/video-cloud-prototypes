Alerts #/alerts; Alert detail #/alert/1; Site #/site;
Output #/output; Me #/me.

Local session state: factory, selected device/alert, filters, expanded groups,
trend parameter/range, independent site ranges, passage expansion,

Offline refresh/submission retains existing data and result text.

function tone(v){return ['High','Unhandled','In alert','Offline','Above threshold','Stopped','Alert'].includes(v)?'danger':['Medium','In progress','Near threshold','Reduced speed'].includes(v)?'warning':['Online','Normal','Running','Achieved'].includes(v)?'success':v==='Low'?'info':'neutral'}
function badge(v){return `<span class="badge ${tone(v)}">${escapeHTML(v)}</span>`}
function empty(message,sub=''){return `<div class="empty">${icon('empty',24)}${message}${sub?`<div class="caption">${sub}</div>`:''}</div>`}
function kv(a,b){return `<div class="kv"><span>${a}</span><span>${b??'—'}</span></div>`}
function chips(key,items){return `<div class="chips" role="group" aria-label="${key.replace(/([A-Z])/g,' $1')}">${items.map(v=>`<button class="chip ${state[key]===v?'active':''}" data-set="${key}" data-value="${v}" aria-pressed="${state[key]===v}">${v}</button>`).join('')}</div>`}
function workshopSelect(key){return `<div class="selectline"><label for="${key}">Workshop</label><select id="${key}" data-field="${key}">${['All',...WORKSHOPS].map(s=>`<option ${state[key]===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function syncText(){const minutes=Math.floor((Date.now()-state.lastSync)/60000);return minutes<1?'Synced just now':minutes<=60?`Synced ${minutes} min ago`:`Synced at ${new Date(state.lastSync).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`}
function alertCount(f){return f.id==='lagos'?ALERTS.filter(a=>a.status==='Unhandled').length:null}
function onlineRate(f){return f.total?((f.online/f.total)*100).toFixed(1):'—'}
function ring(percent,subtitle){const r=36,len=2*Math.PI*r;return `<div class="stack" style="align-items:center"><svg class="ring" viewBox="0 0 94 94" role="img" aria-label="${percent}% achievement"><circle cx="47" cy="47" r="36" fill="none" stroke="var(--border)" stroke-width="6"/><circle cx="47" cy="47" r="36" fill="none" stroke="var(--blue)" stroke-width="6" stroke-dasharray="${len*Number(percent)/100} ${len}" transform="rotate(-90 47 47)"/><text x="47" y="51" text-anchor="middle" fill="var(--ink)" font-size="16" font-weight="600">${percent}%</text></svg><small>${subtitle}</small></div>`}
function chartLine({value,limit,unit,time='14:32',range='24 hours',label='Temperature',series=null}){
 const many=Array.isArray(series)&&series.length>1;
 const vals=many?series.map(p=>p[1]):(value!=null?[value]:[]);
 const hi=Math.max(...(vals.length?vals:[0]),limit||0);
 const max=hi>0?hi*1.18:100;
 const X=x=>36+x*277, Y=v=>168-v/max*122;
 const pts=many?series.map((p,k)=>`${X(k/(series.length-1))},${Y(p[1])}`).join(' '):`${X(1)},${Y(value)}`;
 const peak=many?series.reduce((a,b)=>b[1]>a[1]?b:a,series[0]):null;
 return `<svg class="chart" viewBox="0 0 325 212" role="img" aria-label="${label} trend over ${range}, ${unit}">
 <text x="1" y="13">${unit}</text>${[0,.5,1].map(fr=>`<line x1="36" y1="${168-fr*122}" x2="313" y2="${168-fr*122}" stroke="var(--border)"/><text x="29" y="${172-fr*122}" text-anchor="end">${Number(max*fr).toFixed(unit==='mm/s'?1:0)}</text>`).join('')}
 ${limit!=null?`<path d="M36 ${Y(limit)}H313" fill="none" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="310" y="${Y(limit)-6}" text-anchor="end" style="fill:var(--red)">Limit ${limit} ${unit}</text>`:''}
 <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
 ${many?series.map((p,k)=>`<circle cx="${X(k/(series.length-1))}" cy="${Y(p[1])}" r="2.4" fill="var(--blue)"/>`).join(''):''}
 ${peak?`<circle cx="${X(series.indexOf(peak)/(series.length-1))}" cy="${Y(peak[1])}" r="5" fill="var(--red)"/><path d="M${X(series.indexOf(peak)/(series.length-1))} ${Y(peak[1])+5}V168" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${X(series.indexOf(peak)/(series.length-1))}" y="${Math.min(158,Y(peak[1])+22)}" text-anchor="middle" style="fill:var(--red)">${peak[0]} · ${peak[1]} ${unit}</text>`:''}
 ${(many?series.filter((_,k)=>k%2===0).map(p=>p[0]):['00:00','06:00','12:00','18:00','24:00']).map((t,k,a)=>`<text x="${36+k*277/Math.max(1,a.length-1)}" y="190" text-anchor="middle">${t}</text>`).join('')}
 </svg>`;
}
function outputChart(){
 const max=Math.max(...WEEK_OUTPUT.map(d=>d.flour),FLOUR_PLAN)*1.12;
 const Y=v=>156-v/max*112;
 return `<svg class="chart" viewBox="0 0 325 201" role="img" aria-label="Seven-day flour output in tonnes, plan ${FLOUR_PLAN} tonnes">
 <text x="1" y="13">t</text>${[0,.5,1].map(f=>`<line x1="35" y1="${156-f*112}" x2="315" y2="${156-f*112}" stroke="var(--border)"/><text x="29" y="${160-f*112}" text-anchor="end">${Math.round(max*f)}</text>`).join('')}
 ${WEEK_OUTPUT.map((d,k)=>`<rect x="${43+k*39}" y="${Y(d.flour)}" width="19" height="${156-Y(d.flour)}" rx="3" fill="var(--blue)"/>`).join('')}
 <path d="M35 ${Y(FLOUR_PLAN)}H315" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"/>
 <text x="313" y="${Y(FLOUR_PLAN)-7}" text-anchor="end" style="fill:var(--amber)">Plan ${FLOUR_PLAN} t</text>
 ${WEEK_OUTPUT.map((d,k)=>`<text x="${52+k*39}" y="180" text-anchor="middle">${d.day.split(' ')[0]}</text>`).join('')}
 <text x="175" y="199" text-anchor="middle">October</text></svg>
 <div class="legend"><span><i class="swatch"></i>Flour output</span><span><i class="swatch" style="background:var(--amber)"></i>Plan</span></div>
 <p class="caption">Pasta line: 90–98 t per day over the same period.</p>`;
}
function vehicleChart(){
 const max=Math.max(...VEHICLE_HOURS.map(h=>h[1]));
 const Y=v=>123-v/max*100;
 return `<svg class="chart" viewBox="0 0 325 164" role="img" aria-label="Vehicle trips by two-hour period, 42 trips in total">
 <text x="1" y="12">trips</text>${[0,Math.round(max/2),max].map(v=>`<line x1="28" y1="${123-v/max*100}" x2="313" y2="${123-v/max*100}" stroke="var(--border)"/><text x="20" y="${127-v/max*100}" text-anchor="end">${v}</text>`).join('')}
 ${VEHICLE_HOURS.map((h,k)=>`<rect x="${34+k*40}" y="${Y(h[1])}" width="26" height="${123-Y(h[1])}" rx="3" fill="var(--blue)"/>`).join('')}
 ${VEHICLE_HOURS.map((h,k)=>`<text x="${47+k*40}" y="143" text-anchor="middle">${h[0].split('—')[0]}</text>`).join('')}
 <text x="172" y="162" text-anchor="middle">Time</text></svg>
 <p class="caption">42 trips today: 18 inbound, 21 outbound, 3 other.</p>`;
}
function metric(label,value,sub,ico,route,extra=''){return `<button class="card metric ${extra}" data-go="${route}"><span class="miniicon">${icon(ico,18)}</span><span class="label">${label}</span><span class="value ${label==='Unhandled alerts'&&Number(value)>0?'red':''}">${value}</span><small>${sub}</small></button>`}
function alertItem(a){const d=DEVICES.find(v=>v.id===a.device);return `<button class="alertitem" data-alert="${a.id}"><div class="row between">${badge(a.level)}<small>${a.time}</small></div><strong>${d.name}</strong><div class="caption">${d.shop}</div><p>${a.message}</p><div class="subrow"><span>${badge(a.status)}</span><span>${escapeHTML(a.handler)} ${icon('chevron',12)}</span></div></button>`}
function home(){const f=factory(),alerts=currentAlerts(),unhandled=alertCount(f);return `<section class="metrics ${state.loading?'skeleton':''}">
${metric('Devices online',`${onlineRate(f)}<span class="unit">%</span>`,`${f.online} / ${f.total} devices`,'devices','/devices')}
${metric('Today’s output',`${n(f.products[0].actual)}<span class="unit"> t</span>`,f.products.map(p=>`${p.name}${p.rate?' · '+p.rate+'%':''}${p!==f.products[0]?' · '+n(p.actual)+' t':''}`).join('<br>'),'chart','/output')}
${metric('Unhandled alerts',unhandled??'—',unhandled!=null?(unhandled?'High priority':'No unhandled alerts'):'Data not connected','alerts','/alerts')}
${metric('People on site',n(f.people),'people currently inside','users','/site','wide')}${metric('Today’s vehicle trips',n(f.vehicles),'trips since 00:00','truck','/site','wide')}</section>
<section class="card"><div class="sectionhead"><h2>Factory snapshot</h2><small>3 factories</small></div><div class="snapshot muted" style="padding-top:0"><span>Factory</span><span class="right">Online</span><span class="right">Unhandled</span></div>${FACTORIES.map((v,i)=>`<button class="snapshot" style="width:100%" data-factory="${i}"><strong class="${(alertCount(v)||0)>0?'red':''}">${v.name}</strong><span class="right ${Number(onlineRate(v))<90?'red':Number(onlineRate(v))<95?'amber':''}">${onlineRate(v)}%</span><span class="right ${(alertCount(v)||0)>0?'red':'muted'}">${alertCount(v)??'—'}</span></button>`).join('')}</section>
<section class="card"><div class="sectionhead"><h2>Key alerts</h2><button class="textlink" data-go="/alerts">View all ${icon('chevron',12)}</button></div>${alerts?(alerts.filter(a=>a.status!=='Closed').sort((a,b)=>['High','Medium','Low'].indexOf(a.level)-['High','Medium','Low'].indexOf(b.level)||b.time.localeCompare(a.time)).slice(0,3).map(alertItem).join('')||empty('No unhandled alerts')):empty('Data source not connected','Alert records are unavailable for this factory.')}</section>
<section class="card"><h2>Production lines</h2>${isLagos()?`<div class="line-status danger"><span>Flour Workshop 2</span>${badge(ALERTS[0].status==='Closed'?'No data':'Alert')}</div><div class="line-status" style="border-color:var(--border)"><span>Flour Workshop 1</span>${badge('No data')}</div><div class="line-status" style="border-color:var(--border)"><span>Pasta Line</span>${badge('No data')}</div><div class="line-status" style="border-color:var(--border)"><span>Packaging Line</span>${badge('No data')}</div><p class="caption">Other current line states are unavailable.</p>`:empty('Data source not connected','Production line status is unavailable.')}</section>`}
function deviceParams(d){if(d.status==='Offline')return ['Pressure —','Runtime —'];if(d.shop==='Utilities')return [`Pressure ${d.pressure??'—'}${d.pressure?' bar':''}`,`Runtime ${n(d.hours)}${d.hours?' h':''}`];if(d.sensitivity)return ['Sensitivity Normal','Runtime —'];return [`Bearing temp. ${d.temperature??'—'}${d.temperature?' °C':''}`,`Vibration ${d.vibration??'—'}${d.vibration?' mm/s':''}`]}
function devices(){const f=factory(),list=currentDevices().filter(d=>(state.deviceStatus==='All'||(state.deviceStatus==='In alert'?d.status==='In alert':state.deviceStatus==='Online'?['Online','In alert'].includes(d.status):d.status===state.deviceStatus))&&(state.workshop==='All'||d.shop===state.workshop));const groups=WORKSHOPS.filter(w=>list.some(d=>d.shop===w)).sort((a,b)=>Number(list.some(d=>d.shop===b&&['Offline','In alert'].includes(d.status)))-Number(list.some(d=>d.shop===a&&['Offline','In alert'].includes(d.status))));return `<section class="card stats"><div><small>Total</small><span class="value">${f.total}</span></div><div><small>Online</small><span class="value green">${f.online}</span></div><div><small>Offline</small><span class="value red">${f.total-f.online}</span></div><div><small>In alert</small><span class="value amber">${isLagos()?DEVICES.filter(d=>d.status==='In alert').length:'—'}</span></div></section><section class="filters">${workshopSelect('workshop')}${chips('deviceStatus',['All','Online','Offline','In alert'])}</section>${groups.length?groups.map(w=>{const ds=list.filter(d=>d.shop===w),bad=ds.filter(d=>['Offline','In alert'].includes(d.status)).length;return `<section class="card"><button class="grouphead" data-group="${w}" aria-expanded="${!!state.groups[w]}"><div class="stack"><h2>${w}</h2><small class="${bad?'red':''}">${bad} abnormal · ${ds.length} listed</small></div>${icon(state.groups[w]?'down':'chevron',18)}</button>${state.groups[w]?`<div class="groupbody">${ds.map(d=>`<button class="device-row" data-device="${d.id}"><span class="equipment-icon">${icon('devices',20)}</span><span class="stack"><span class="subrow"><span class="device-name">${d.name}</span>${badge(d.status)}</span><small>${d.brand??'Brand unavailable'} · ${d.year}</small><small>${deviceParams(d).join(' · ')}</small><small>${d.offline?`Offline ${d.offline} min`:`Latest alert: ${d.last??'—'}`}</small></span></button>`).join('')}</div>`:''}</section>`}).join(''):`<section class="card">${empty(isLagos()?'No devices match these filters':'Device records not connected',isLagos()?'Change or reset your filters.':'Factory totals are available; device-level data is not connected.')}<button class="secondary" data-reset="devices">Reset filters</button></section>`}`}
function parameterCard(name,value,limit,unit){const status=value==null||limit==null?'No data':value>limit?'Above threshold':value>=limit*.9?'Near threshold':'Normal';return `<div class="parameter"><small>${name}</small><div class="value medium">${n(value)} <span class="unit">${unit}</span></div><small>Threshold ${limit??'—'}${limit!=null?' '+unit:''}</small>${badge(status)}</div>`}
function deviceDetail(){const d=selectedDevice();if(!d)return `<div class="card">${empty('Device data not connected')}</div>`;const a=ALERTS.filter(a=>a.device===d.id),temp=state.parameter==='Temperature';return `<section class="card"><div class="row between"><h1>${d.name}</h1>${badge(d.status)}</div><p class="caption">${d.shop}</p>${kv('Brand / model',d.brand??'—')}${kv('Commissioned',d.year)}${kv('Equipment number','—')}</section>${d.offline?`<div class="notice error">${icon('warning',18)}Device offline. Last reported ${d.offline} min ago.</div>`:''}<section class="card"><div class="sectionhead"><h2>Live parameters</h2><small>Latest reading</small></div><div class="grid2">${parameterCard('Bearing temperature',d.offline?null:d.temperature,d.tempLimit,'°C')}${parameterCard('Vibration',d.offline?null:d.vibration,d.vibLimit,'mm/s')}${parameterCard('Current',d.offline?null:d.current,d.currentLimit,'A')}${parameterCard('Speed',d.offline?null:d.speed,d.speedLimit,'rpm')}</div>${d.pressure?kv('Pressure',d.pressure+' bar'):''}${d.hours?kv('Accumulated runtime',n(d.hours)+' h'):''}${d.sensitivity?kv('Sensitivity',d.sensitivity):''}</section><section class="card"><div class="sectionhead"><h2>Parameter trend</h2></div>${chips('parameter',['Temperature','Vibration'])}<div style="margin:12px 0">${chips('trendRange',['24 hours','7 days'])}</div>${chartLine({value:temp?d.temperature:d.vibration,limit:temp?d.tempLimit:d.vibLimit,unit:temp?'°C':'mm/s',time:d.last||'14:40',range:state.trendRange,label:state.parameter,series:d.id===1?(temp?TREND_TEMP:TREND_VIB):null})}</section><section class="card"><div class="sectionhead"><h2>Recent alerts</h2><small>Up to 3</small></div>${a.slice(0,3).map(alertItem).join('')||empty('No alert records')}</section><section class="card"><div class="sectionhead"><h2>Maintenance & repairs</h2><small>Last 5</small></div>${MAINTENANCE.map(m=>`<div class="listrow"><div class="row between"><strong>${m.type}</strong><small class="muted">${m.date}</small></div><p class="caption">${m.work}</p><div class="subrow small"><span>${m.by}</span></div></div>`).join('')}</section><section class="card"><h2>Equipment information</h2>${kv('Installation location',DEVICE_META.installed)}${kv('Responsible team',DEVICE_META.team)}${kv('Next planned maintenance',DEVICE_META.nextService)}</section>`}
function alertsPage(){const list=currentAlerts();const filtered=(list||[]).filter(a=>(state.alertStatus==='All'||a.status===state.alertStatus)&&(state.level==='All'||a.level===state.level)&&(state.alertWorkshop==='All'||DEVICES.find(d=>d.id===a.device).shop===state.alertWorkshop));return `<section class="card stats three">${['Unhandled','In progress','Closed'].map(s=>`<div><small>${s==='Closed'?'Closed today':s}</small><span class="value ${s==='Unhandled'?'red':s==='In progress'?'amber':''}">${list?list.filter(a=>a.status===s).length:'—'}</span></div>`).join('')}</section><section class="filters">${chips('alertStatus',['All','Unhandled','In progress','Closed'])}${chips('level',['All','High','Medium','Low'])}${workshopSelect('alertWorkshop')}</section>${list?(['Unhandled','In progress','Closed'].map(s=>{const rows=filtered.filter(a=>a.status===s).sort((a,b)=>b.time.localeCompare(a.time));return rows.length?`<section class="card"><div class="sectionhead"><h2>${s}</h2><small>${rows.length} alerts</small></div>${rows.slice(0,state.pageSize).map(alertItem).join('')}${rows.length>state.pageSize?'<button class="secondary" data-more>Load more</button>':''}</section>`:''}).join('')||`<section class="card">${empty(list.length?'No alerts match these filters':'No alerts today')}<button class="secondary" data-reset="alerts">Reset filters</button></section>`):`<section class="card">${empty('Data source not connected','Alert counts and records are unavailable.')}</section>`}`}
function minutesSince(time){const [h,m]=time.split(':').map(Number);return Math.max(0,(14*60+40+Math.floor((Date.now()-sessionStart)/60000))-(h*60+m))}
const sessionStart=Date.now();
function sessionTime(){const date=new Date(2026,9,26,14,40);date.setTime(date.getTime()+Date.now()-sessionStart);return date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function timelineItem(title,person,time,desc=''){return `<li><strong>${title}</strong><p>${escapeHTML(person)} · ${escapeHTML(time)}${desc?'\n'+escapeHTML(desc):''}</p></li>`}
function alertDetail(){const a=selectedAlert();if(!a)return `<section class="card">${empty('Alert data not connected')}</section>`;const d=DEVICES.find(d=>d.id===a.device);let steps=timelineItem('Notification','Recipient unavailable','Delivery time unavailable');if(a.status!=='Unhandled'){steps+=timelineItem('Accepted',a.handler,a.acceptedAt||'Time unavailable');steps+=timelineItem('In progress',a.handler,a.acceptedAt||'Time unavailable',a.action||'Measures not recorded');}if(a.status==='Closed')steps+=timelineItem('Closed',a.handler,a.closedAt||'11:32',a.result||'Result not recorded')+timelineItem('Resolution time',a.handler,a.closedAt||'11:32',`${a.duration} min from occurrence to closure`);return `<section class="card"><div class="row between">${badge(a.level)}${badge(a.status)}</div><h1 style="margin-top:16px">${a.metric} alert</h1><p style="margin-top:10px">${a.message}</p>${kv('Occurred','26 Oct · '+a.time)}${kv(a.status==='Closed'?'Resolution time':'Duration',`${a.duration??minutesSince(a.time)} min`)}</section><section class="card"><button class="row between" style="width:100%" data-device="${d.id}"><span class="stack"><h2>${d.name}</h2><small>${d.shop}</small></span><span class="blue">${icon('chevron',18)}</span></button>${kv('Indicator',a.metric)}${kv('Value at occurrence',a.value!=null?n(a.value)+' '+a.unit:'Metal detected')}${kv('Threshold',a.limit!=null?n(a.limit)+' '+a.unit:'—')}${kv('Above threshold',a.limit!=null?`${Number((a.value-a.limit).toFixed(1))} ${a.unit} (${((a.value-a.limit)/a.limit*100).toFixed(1)}%)`:'—')}</section><section class="card"><div class="sectionhead"><h2>Related trend</h2><small>24 hours</small></div>${a.unit==='°C'||a.unit==='mm/s'?chartLine({value:a.value,limit:a.limit,unit:a.unit,time:a.time,label:a.metric}):empty('Historical data not connected')}</section><section class="card"><div class="sectionhead"><h2>Response timeline</h2>${icon('clock',18)}</div><ol class="timeline">${steps}</ol></section>`}
function peopleSection(){const f=factory(),today=state.peopleRange==='Today';return `<section class="card"><div class="sectionhead"><h2>People</h2>${icon('users',20)}</div>${chips('peopleRange',['Today','Yesterday','7 days'])}${today?`<div class="stats three" style="grid-template-columns:1fr 1fr;margin-top:20px"><div><small>Entries & exits</small><span class="value">${isLagos()?'412':'—'}</span><small>passages today</small></div><div><small>Currently on site</small><span class="value blue">${f.people}</span><small>people</small></div></div>${isLagos()?`<div class="distribution"><span style="flex:268"></span><span style="flex:74;opacity:.65"></span><span style="flex:44;opacity:.35"></span></div>${[['Workshop',268],['Warehouse',74],['Office',44],['Other',null]].map(([name,val])=>`<div class="area-row"><span class="muted">${name}</span><span>${n(val)}</span></div>`).join('')}<button class="notice error" style="width:100%;margin-top:16px;justify-content:space-between" data-anomaly><span class="row">${icon('warning',16)}1 abnormal entry</span>${icon(state.anomaly?'down':'chevron',16)}</button>${state.anomaly?`${kv('Time','14:05')}${kv('Area','Packaging Workshop')}${kv('Reason','Tailgating entry')}`:''}`:empty('Data source not connected','Entry totals, area distribution and exceptions are unavailable.')}`:empty('No data available',`People records for ${state.peopleRange.toLowerCase()} are unavailable.`)}</section>`}
function vehiclesSection(){const today=state.vehicleRange==='Today',f=factory();return `<section class="card"><div class="sectionhead"><h2>Vehicles</h2>${icon('truck',20)}</div>${chips('vehicleRange',['Today','Yesterday','7 days'])}${today?`<div class="row between" style="margin-top:20px"><div class="stack"><small>Total vehicle trips</small><span class="value">${f.vehicles}</span></div>${isLagos()?`<div class="stack"><small>Raw grain inbound <b>18</b></small><small>Finished goods outbound <b>21</b></small><small>Other trips <b>3</b></small></div>`:''}</div>${isLagos()?`<h3 style="margin:24px 0 12px">Passages by hour</h3>${vehicleChart()}<h3 style="margin:24px 0 12px">Recent passages</h3>${PASSAGES.map((p,i)=>`<div class="passage"><button class="row" style="width:100%" data-passage="${i}" aria-expanded="${state.passage===i}"><span class="thumbnail">${icon('image',22)}</span><span class="stack" style="flex:1"><strong>${p.plate}</strong><small>${p.direction} · ${p.time}</small></span>${icon(state.passage===i?'down':'chevron',16)}</button>${state.passage===i?`<div class="capture">${icon('image',30)}Capture unavailable</div>${kv('Plate',p.plate)}${kv('Vehicle type','—')}${kv('Direction',p.direction)}${kv('Passage time',p.time)}${kv('Dwell time','—')}`:''}</div>`).join('')}`:empty('Data source not connected','Direction, hourly distribution and passage records are unavailable.')}`:empty('No data available',`Vehicle records for ${state.vehicleRange.toLowerCase()} are unavailable.`)}</section>`}
function site(){return peopleSection()+vehiclesSection()}
function output(){const f=factory(),today=state.outputRange==='Today',actual=f.products.reduce((s,p)=>s+p.actual,0),plan=f.products.every(p=>p.plan!=null)?f.products.reduce((s,p)=>s+p.plan,0):null;return `${chips('outputRange',['Today','7 days','This month'])}${today?`<section class="card"><div class="sectionhead"><h2>Today’s output</h2><small>As of now</small></div><div class="row between"><div class="stack"><span class="value">${n(actual)} <span class="unit">t</span></span><small>${f.products.map(p=>p.name+' '+n(p.actual)+' t').join(' · ')}</small>${plan?`<small>${n(plan-actual)} t below plan</small>`:''}</div>${plan?ring((actual/plan*100).toFixed(1),`${n(actual)} / ${n(plan)} t`):''}</div><p class="caption">Yesterday full day: 1,245 t flour &middot; 97 t pasta.</p></section><section class="card"><div class="sectionhead"><h2>Product lines</h2></div>${chips('product',['All','Flour','Pasta','Feed','Oil'])}<div style="margin-top:16px">${['Flour','Pasta','Feed','Oil'].filter(p=>state.product==='All'||state.product===p).map(name=>{const p=f.products.find(p=>p.name===name);return `<div class="listrow"><div class="row between"><strong>${name}</strong><span>${p?n(p.actual)+' t':'Data not connected'}</span></div>${p?`${p.plan?`<div class="progress"><span style="width:${p.rate}%"></span></div><div class="subrow small"><span>Plan ${n(p.plan)} t</span><span class="blue">${p.rate}% achieved</span></div>`:'<p class="caption">Plan not issued</p>'}`:''}</div>`}).join('')}</div></section><section class="card"><div class="sectionhead"><h2>7-day output</h2><small>20–26 Oct</small></div>${outputChart()}</section><section class="card"><div class="sectionhead"><h2>Downtime impact</h2></div>${isLagos()?`<button class="listrow" data-downtime="flour"><div class="row between"><strong>Flour Workshop 2</strong>${icon(state.downtime==='flour'?'down':'chevron',16)}</div><p class="caption">Roller mill temperature alert</p><div class="row between" style="margin-top:12px"><span class="value medium">1.8 <span class="unit">h</span></span><span class="red">≈ 108 t lost</span></div>${state.downtime==='flour'?`${kv('Equipment','3# Roller Mill')}${kv('Downtime period','13:52 - 15:40')}`:''}</button><button class="listrow" data-downtime="packaging"><div class="row between"><strong>Packaging Line</strong>${icon(state.downtime==='packaging'?'down':'chevron',16)}</div><p class="caption">Metal detection shutdown</p><div class="row between" style="margin-top:12px"><span class="value medium">0.4 <span class="unit">h</span></span><span class="red">≈ 24 t lost</span></div>${state.downtime==='packaging'?`${kv('Equipment','Metal Detector')}${kv('Downtime period','13:52 - 15:40')}`:''}</button><p class="caption">Flour line: 1 h of downtime ≈ 60 t of lost output.</p>`:empty('Downtime data not connected')}</section>`:`<section class="card">${empty('No output data available',`${state.outputRange} totals, plans, comparison, trend and downtime data are unavailable.`)}</section>`}`}
function me(){return `<section class="card"><div class="row"><div class="avatar">${icon('me',25)}</div><div class="stack"><h2>Current user</h2><small>Group management account</small></div></div>${kv('Name',ACCOUNT.name)}${kv('Position',ACCOUNT.position)}${kv('Region',ACCOUNT.region)}</section><section class="card"><div class="sectionhead"><h2>My factories</h2><small>Read only</small></div>${FACTORIES.map(f=>`<div class="listrow"><strong>${f.name}</strong><p class="caption">All factory · Assigned by administrator</p></div>`).join('')}</section><section class="card"><div class="sectionhead"><h2>Alert subscriptions</h2>${icon('alerts',18)}</div>${['High','Medium','Low'].map(l=>`<div class="listrow row between"><div class="stack"><span>${l} severity</span><small>${l==='High'?'Required · always enabled':'Push notifications'}</small></div><button role="switch" aria-label="${l} severity notifications" aria-checked="${l==='High'||state.subscriptions[l]}" class="toggle ${l==='High'||state.subscriptions[l]?'on':''}" ${l==='High'?'disabled':''} data-subscription="${l}"></button></div>`).join('')}<div class="listrow"><h3>Push hours</h3><p class="caption">${state.pushStart&&state.pushEnd?state.pushStart+'–'+state.pushEnd:'Schedule not set'}</p><div class="row between" style="margin-top:12px"><label class="stack"><small>From</small><input type="time" data-field="pushStart" value="${state.pushStart}" aria-label="Push start time"></label><label class="stack"><small>To</small><input type="time" data-field="pushEnd" value="${state.pushEnd}" aria-label="Push end time"></label></div></div></section><section class="card"><h2>About</h2>${kv('App','Olam Factory Operations')}${kv('Version','0.1')}${kv('Data updated',syncText())}</section>`}
const routes={'/home':home,'/devices':devices,'/device/1':deviceDetail,'/alerts':alertsPage,'/alert/1':alertDetail,'/site':site,'/output':output,'/me':me};
let lastRoute='',backRoutes={'/device/1':'/devices','/alert/1':'/alerts','/output':'/home'};
const route=()=>location.hash.slice(1)||'/home';
function go(path){if(path==='/alerts'&&route()==='/home')state.alertStatus='Unhandled';if(path===route())render();else location.hash=path}
function openDevice(id){state.device=Number(id);state.parameter='Temperature';state.trendRange='24 hours';backRoutes['/device/1']=route();go('/device/1')}
function openAlert(id){state.alert=Number(id);backRoutes['/alert/1']=route();go('/alert/1')}
function render(keepScroll=false){let r=route();if(!routes[r]){location.hash='/home';return}const scroll=document.querySelector('#content').scrollTop;const detail=['/device/1','/alert/1','/output'].includes(r);const title={'/home':'Overview','/devices':'Devices','/device/1':'Device details','/alerts':'Alerts','/alert/1':'Alert details','/site':'Site','/output':'Output','/me':'Me'}[r];document.querySelector('#header').innerHTML=r==='/home'?`<div class="headcopy"><button class="factory-title" data-open-factories><span>${factory().name}</span>${icon('down',16)}</button><small>${state.loading?'Syncing…':syncText()}</small></div><button class="iconbtn" aria-label="Refresh data" data-refresh>${icon('refresh')}</button><button class="iconbtn" aria-label="Message subscriptions" data-go="/me">${icon('alerts')}</button>`:`${detail?`<button class="iconbtn" aria-label="Back" data-back>${icon('back')}</button>`:''}<div class="headcopy"><h1>${title}</h1><small>${factory().name}</small></div>${!detail?`<button class="iconbtn" aria-label="Refresh data" data-refresh>${icon('refresh')}</button>`:''}`;
 document.querySelector('#content').innerHTML=`<div class="page">${state.syncFailed?`<button class="notice error" data-refresh>${icon('warning',18)}Data sync failed. Showing last data. ${syncText()}. Tap to retry.</button>`:''}${routes[r]()}</div>`;
 const a=selectedAlert();document.querySelector('#action').innerHTML=r==='/alert/1'&&a&&a.status!=='Closed'?`<div class="actionbar"><button class="primary" ${a.claimedByOther?'disabled':''} data-alert-action>${a.claimedByOther?`Accepted by ${escapeHTML(a.handler)}`:a.status==='Unhandled'?'Accept':'Close with result'}</button></div>`:'';
 const active=r==='/device/1'?'/devices':r==='/alert/1'?'/alerts':r==='/output'?'/home':r;document.querySelector('#tabs').innerHTML=[['Home','home'],['Devices','devices'],['Alerts','alerts'],['Site','site'],['Me','me']].map(([label,ico])=>`<a href="#/${ico}" class="tab ${active==='/'+ico?'active':''}" ${active==='/'+ico?'aria-current="page"':''}>${icon(ico,22)}${label}</a>`).join('');
 if(!keepScroll||lastRoute!==r)document.querySelector('#content').scrollTop=0;else document.querySelector('#content').scrollTop=scroll;lastRoute=r;document.title=`${title} · Olam`;renderModal();}
function renderModal(){const modal=document.querySelector('#modal');if(!state.modal){modal.innerHTML='';return}modal.innerHTML=`<div class="overlay" data-overlay><section class="sheet" role="dialog" aria-modal="true" aria-label="${state.modal==='factories'?'Select factory':'Close alert'}"><div class="handle"></div><div class="sectionhead"><h2>${state.modal==='factories'?'Select factory':'Close with result'}</h2><button class="iconbtn" data-close-modal aria-label="Close">${icon('close',18)}</button></div>${state.modal==='factories'?`<p class="small" style="margin-bottom:16px">Your accessible factories</p>${FACTORIES.map((f,i)=>`<button class="factory-option" data-factory="${i}"><span><strong>${f.name}</strong><small>${onlineRate(f)}% online · ${alertCount(f)??'—'} unhandled${alertCount(f)==null?' (not connected)':''}</small></span>${i===state.factory?`<span class="blue">${icon('check',20)}</span>`:icon('chevron',18)}</button>`).join('')}`:`<form id="result-form"><p class="small">Record the action taken and the outcome.</p><div class="chips" style="margin-top:16px">${['Maintenance','Repair','Replacement','Other'].map(v=>`<button type="button" class="chip ${state.reason===v?'active':''}" data-reason="${v}">${v}</button>`).join('')}</div><label for="result" class="small" style="display:block;margin-top:16px">Resolution result · required</label><textarea id="result" name="result" minlength="10" required>${escapeHTML(state.result)}</textarea><p class="small">At least 10 characters. Closure is final.</p><div id="result-error" class="error-text" role="alert"></div><button class="primary" type="submit" style="margin-top:16px">Submit & close</button></form>`}</section></div>`;}
function selectFactory(index){state.factory=Number(index);state.modal=null;state.device=1;state.alert=1;state.deviceStatus='All';state.workshop='All';state.alertStatus='All';state.level='All';state.alertWorkshop='All';state.peopleRange='Today';state.vehicleRange='Today';state.outputRange='Today';state.product='All';state.passage=null;state.anomaly=false;state.loading=true;render();setTimeout(()=>{state.loading=false;render(true)},350)}
function toast(text){document.querySelector('#feedback').innerHTML=`<div class="toast">${escapeHTML(text)}</div>`;setTimeout(()=>document.querySelector('#feedback').innerHTML='',3200)}
function refresh(){if(!navigator.onLine){state.syncFailed=true;render(true);return}state.loading=true;render(true);setTimeout(()=>{state.loading=false;state.syncFailed=false;state.lastSync=Date.now();render(true)},400)}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(e.target.matches('[data-overlay]')){state.modal=null;renderModal();return}if(!el)return;
if(el.dataset.go){go(el.dataset.go);return}if(el.hasAttribute('data-open-factories')){state.modal='factories';renderModal();return}if(el.hasAttribute('data-close-modal')){state.modal=null;renderModal();return}if(el.dataset.factory!=null){selectFactory(el.dataset.factory);return}if(el.dataset.set){state[el.dataset.set]=el.dataset.value;if(el.dataset.set==='vehicleRange')state.passage=null;render(true);return}if(el.dataset.group){state.groups[el.dataset.group]=!state.groups[el.dataset.group];render(true);return}if(el.dataset.device){openDevice(el.dataset.device);return}if(el.dataset.alert){openAlert(el.dataset.alert);return}if(el.hasAttribute('data-back')){go(backRoutes[route()]||'/home');return}if(el.hasAttribute('data-refresh')){refresh();return}if(el.dataset.passage!=null){state.passage=state.passage===Number(el.dataset.passage)?null:Number(el.dataset.passage);render(true);return}if(el.hasAttribute('data-anomaly')){state.anomaly=!state.anomaly;render(true);return}if(el.dataset.downtime){state.downtime=state.downtime===el.dataset.downtime?null:el.dataset.downtime;render(true);return}if(el.dataset.subscription){state.subscriptions[el.dataset.subscription]=!state.subscriptions[el.dataset.subscription];render(true);return}if(el.dataset.reason){state.reason=el.dataset.reason;renderModal();document.querySelector('#result').focus();return}if(el.hasAttribute('data-more')){state.pageSize+=20;render(true);return}if(el.dataset.reset){if(el.dataset.reset==='devices'){state.deviceStatus='All';state.workshop='All'}else{state.alertStatus='All';state.level='All';state.alertWorkshop='All'}render(true);return}if(el.hasAttribute('data-alert-action')){const a=selectedAlert();if(!a||a.status==='Closed')return;if(a.status==='Unhandled'){if(!navigator.onLine){toast('Acceptance failed. Please retry.');return}a.status='In progress';a.handler='Current user';a.acceptedAt=sessionTime();a.action='Accepted for investigation';render(true)}else{state.modal='result';state.result='';state.reason='';renderModal();document.querySelector('#result').focus()}return}});
document.addEventListener('change',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;if(e.target.tagName==='SELECT')render(true)}});
document.addEventListener('input',e=>{if(e.target.id==='result')state.result=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='result-form')return;e.preventDefault();const a=selectedAlert(),result=state.result.trim(),err=document.querySelector('#result-error');if(result.length<10){err.textContent='Enter a result of at least 10 characters.';return}if(/[\u3400-\u9FFF]/.test(result)){err.textContent='Please enter the result in English.';return}if(!navigator.onLine){err.textContent='Submission failed. Please retry. Your result has been retained.';return}if(a.claimedByOther){err.textContent=`This alert has already been accepted by ${a.handler}.`;return}a.status='Closed';a.result=(state.reason?state.reason+': ':'')+result;a.closedAt=sessionTime();a.duration=minutesSince(a.time);a.handler='Current user';state.modal=null;render(true);toast('Alert closed. Resolution recorded.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderModal()}if(e.key==='Tab'&&state.modal){const nodes=[...document.querySelectorAll('#modal button:not(:disabled),#modal textarea')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{state.modal=null;render()});window.addEventListener('offline',()=>{state.syncFailed=true;render(true)});if(!location.hash)location.hash='/home';render();
</script>
</body>
</html>
